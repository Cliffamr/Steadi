# ABOUTME: Builds the Windows NSIS installer for version tags.
# ABOUTME: Publishes an unsigned prerelease plus a SHA-256 checksum.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: npx tauri build --no-sign
      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer tidak ditemukan" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii checksums-sha256.txt
          "INSTALLER=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Publish unsigned prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "$env:INSTALLER" checksums-sha256.txt `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "Veil Browser $env:GITHUB_REF_NAME" `
            --prerelease `
            --notes "Windows-first preview. Installer belum ditandatangani. Verifikasi manual Zoom, Google Meet, Microsoft Teams, Discord, OBS, dan regression recording-first tetap wajib sebelum penggunaan sensitif."
