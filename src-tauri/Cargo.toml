[package]
name = "veil-browser"
version = "0.1.0"
description = "Windows private browser overlay for screen sharing"
authors = ["Arif Maulana Rokhman"]
license = "MIT"
repository = "https://github.com/Cliffamr/Steadi"
homepage = "https://github.com/Cliffamr/Steadi"
readme = "../README.md"
keywords = ["browser", "overlay", "privacy", "windows", "webview2"]
categories = ["gui", "web-programming"]
edition = "2021"

[lib]
name = "veil_browser"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["unstable"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
